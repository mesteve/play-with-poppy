<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play with Poppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/games/bubbles.css">
<link rel="stylesheet" href="css/games/hide.css">
<link rel="stylesheet" href="css/games/music.css">
<link rel="stylesheet" href="css/games/count.css">
<link rel="stylesheet" href="css/games/path.css">
</head>
<body>
<div id="app">
  <div id="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="cloud c1"><svg viewBox="0 0 200 90"><g class="cl"><ellipse cx="60" cy="60" rx="50" ry="26"/><ellipse cx="110" cy="44" rx="48" ry="36"/><ellipse cx="150" cy="62" rx="40" ry="24"/><rect x="20" y="58" width="165" height="28" rx="14"/></g></svg></div>
    <div class="cloud c2"><svg viewBox="0 0 200 90"><g class="cl"><ellipse cx="60" cy="60" rx="50" ry="26"/><ellipse cx="110" cy="44" rx="48" ry="36"/><ellipse cx="150" cy="62" rx="40" ry="24"/><rect x="20" y="58" width="165" height="28" rx="14"/></g></svg></div>
    <div class="cloud c3"><svg viewBox="0 0 200 90"><g class="cl"><ellipse cx="60" cy="60" rx="50" ry="26"/><ellipse cx="110" cy="44" rx="48" ry="36"/><ellipse cx="150" cy="62" rx="40" ry="24"/><rect x="20" y="58" width="165" height="28" rx="14"/></g></svg></div>
    <svg class="hills" viewBox="0 0 1200 400" preserveAspectRatio="none">
      <path class="h1" d="M0 170C200 90 380 120 560 150C760 185 930 80 1200 130L1200 400L0 400Z"/>
      <path class="h2" d="M0 240C180 190 360 210 520 235C700 262 900 180 1200 220L1200 400L0 400Z"/>
      <path class="h3" d="M0 310C250 280 520 300 760 290C950 282 1080 300 1200 295L1200 400L0 400Z"/>
    </svg>
  </div>

  <div class="topbar">
    <button id="homeBtn" class="round" aria-label="Back to games" hidden>
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8 2.3 11.6H5v9h5.2v-5.8h3.6v5.8H19v-9h2.7z"/></svg>
    </button>
    <div class="spacer"></div>
    <button id="fsBtn" class="round" aria-label="Full screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    </button>
    <button id="soundBtn" class="round" aria-label="Sound on or off"></button>
  </div>

  <section id="start" class="screen active">
    <div class="wrap">
      <h1 class="title">Play with Poppy</h1>
      <div id="startPoppy"></div>
      <button id="playBtn" class="play" aria-label="Play">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z"/></svg>
      </button>
    </div>
  </section>

  <section id="menu" class="screen">
    <div class="wrap">
      <div class="cards" id="cards"></div>
      <div id="menuPoppy"></div>
    </div>
  </section>

  <div id="fx" aria-hidden="true"></div>
</div>

<script src="js/core.js"></script>
<script src="js/games/bubbles.js"></script>
<script src="js/games/hide.js"></script>
<script src="js/games/music.js"></script>
<script src="js/games/count.js"></script>
<script src="js/games/path.js"></script>
<script src="js/main.js"></script>
</body>
</html>
