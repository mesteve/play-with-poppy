<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play with Poppy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#8fd2ff;
  --sky-top:#7ccbff;
  --sky-bottom:#e3f6ff;
  --sun:#ffd84d;
  --sun-glow:rgba(255,216,77,.5);
  --cloud:#ffffff;
  --hill-far:#a6dc85;
  --hill-mid:#7fcb68;
  --hill-near:#5db552;
  --stars:0;
  --btn:#ffffff;
  --btn-ink:#4a3426;
  --btn-shadow:rgba(60,80,40,.3);
  --title:#ffffff;
  --title-shadow:#e0742a;
  --slot:rgba(255,255,255,.55);
  --slot-stroke:#ffffff;
  --fox:#f2862e;
  --fox-dark:#b9541a;
  --cream:#fff6e8;
  --ink:#2b2420;
  --scarf:#2fa36b;
  --scarf-dark:#23865a;
  --blush:#ff8fa3;
  --font:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#141c3d;--sky-top:#0f1636;--sky-bottom:#2c3a78;--sun:#f6f1cf;--sun-glow:rgba(246,241,207,.3);
    --cloud:#6f7fbf;--hill-far:#2f5f4a;--hill-mid:#27523f;--hill-near:#1f4634;--stars:1;
    --btn:#2b3672;--btn-ink:#ffffff;--btn-shadow:rgba(0,0,0,.45);--title:#fff6e8;--title-shadow:#b9541a;
    --slot:rgba(255,255,255,.18);--slot-stroke:rgba(255,255,255,.75);
  }
}
:root[data-theme="dark"]{
  --page:#141c3d;--sky-top:#0f1636;--sky-bottom:#2c3a78;--sun:#f6f1cf;--sun-glow:rgba(246,241,207,.3);
  --cloud:#6f7fbf;--hill-far:#2f5f4a;--hill-mid:#27523f;--hill-near:#1f4634;--stars:1;
  --btn:#2b3672;--btn-ink:#ffffff;--btn-shadow:rgba(0,0,0,.45);--title:#fff6e8;--title-shadow:#b9541a;
  --slot:rgba(255,255,255,.18);--slot-stroke:rgba(255,255,255,.75);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--page);font-family:var(--font);color:var(--btn-ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #ffcf33;outline-offset:3px}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* ---------- garden backdrop ---------- */
#scene{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom) 72%);overflow:hidden}
.stars{position:absolute;inset:0 0 45% 0;opacity:var(--stars);animation:twinkle 3s ease-in-out infinite alternate;
  background-image:
   radial-gradient(2px 2px at 8% 14%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 21% 34%,#fff 60%,transparent 61%),
   radial-gradient(1.5px 1.5px at 33% 9%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 44% 26%,#fff 60%,transparent 61%),
   radial-gradient(1.5px 1.5px at 57% 12%,#fff 60%,transparent 61%),radial-gradient(2.5px 2.5px at 66% 38%,#fff 60%,transparent 61%),
   radial-gradient(1.5px 1.5px at 74% 6%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 91% 30%,#fff 60%,transparent 61%),
   radial-gradient(1.5px 1.5px at 13% 52%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 51% 55%,#fff 60%,transparent 61%),
   radial-gradient(1.5px 1.5px at 83% 58%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 28% 70%,#fff 60%,transparent 61%)}
@keyframes twinkle{from{filter:brightness(.7)}to{filter:brightness(1.3)}}
.sun{position:absolute;top:10%;right:14%;width:clamp(60px,11vmin,120px);aspect-ratio:1;border-radius:50%;background:var(--sun);
  box-shadow:0 0 0 14px var(--sun-glow),0 0 70px 24px var(--sun-glow)}
.cloud{position:absolute;left:0;width:clamp(120px,20vw,240px);animation:drift linear infinite}
.cloud svg{display:block;width:100%}
.cl{fill:var(--cloud)}
.c1{top:9%;animation-duration:75s;animation-delay:-25s}
.c2{top:24%;width:clamp(90px,14vw,170px);animation-duration:100s;animation-delay:-70s}
.c3{top:3%;width:clamp(80px,12vw,150px);animation-duration:130s;animation-delay:-100s}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(110vw)}}
.hills{position:absolute;left:0;bottom:0;width:100%;height:46%}
.h1{fill:var(--hill-far)}.h2{fill:var(--hill-mid)}.h3{fill:var(--hill-near)}

/* ---------- top bar ---------- */
.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:50;pointer-events:none}
.spacer{flex:1}
.round{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:none;padding:0;background:var(--btn);color:var(--btn-ink);
  box-shadow:0 6px 0 var(--btn-shadow);display:grid;place-items:center;cursor:pointer;transition:transform .1s,box-shadow .1s}
.round[hidden]{display:none}
.round svg{width:54%;height:54%}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn-shadow)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;z-index:10}
.screen.active{display:block}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}

/* ---------- Poppy the fox ---------- */
.poppy{position:relative;aspect-ratio:200/240;cursor:pointer}
.poppy svg{display:block;width:100%;height:100%;overflow:visible}
.f-fox{fill:var(--fox)}.f-dark{fill:var(--fox-dark)}.f-cream{fill:var(--cream)}.f-ink{fill:var(--ink)}
.f-scarf{fill:var(--scarf)}.f-scarf2{fill:var(--scarf-dark)}.f-blush{fill:var(--blush);opacity:.55}.f-white{fill:#fff}
.s-fox{stroke:var(--fox);stroke-width:8;stroke-linejoin:round}
.p-mouth{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.p-all{transform-origin:100px 232px}
.p-head{transform-origin:100px 140px}
.p-arm{transform-origin:134px 168px}
.p-tail{transform-origin:128px 196px;animation:wag 1.3s ease-in-out infinite alternate}
.p-eyes{transform-origin:100px 92px;animation:blink 4.5s infinite}
.poppy.idle .p-all{animation:bob 2.6s ease-in-out infinite}
.poppy.idle .p-head{animation:tilt 5s ease-in-out infinite}
.poppy.wave .p-arm{animation:wave 2.2s ease-in-out infinite}
.poppy.dance .p-all{animation:dance .46s ease-in-out infinite alternate}
.poppy.dance .p-arm{animation:wavefast .46s ease-in-out infinite alternate}
.poppy.jump .p-all{animation:jump .62s cubic-bezier(.3,.7,.4,1) 2}
@keyframes wag{from{transform:rotate(-9deg)}to{transform:rotate(10deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}15%{transform:rotate(-140deg)}30%{transform:rotate(-115deg)}45%{transform:rotate(-145deg)}60%{transform:rotate(-118deg)}75%{transform:rotate(-140deg)}88%{transform:rotate(-8deg)}}
@keyframes wavefast{from{transform:rotate(-30deg)}to{transform:rotate(-150deg)}}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-10px)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-40px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1,1)}}

/* ---------- start ---------- */
#start .wrap{gap:2.2vh;padding-bottom:4vh}
#start .poppy{height:min(42vh,340px)}
.title{margin:0;font-weight:700;font-size:clamp(34px,7vmin,64px);line-height:1.05;color:var(--title);text-shadow:0 4px 0 var(--title-shadow);text-align:center}
.play{width:clamp(110px,18vmin,150px);aspect-ratio:1;border-radius:50%;border:none;padding:0;background:#ff7a3d;
  box-shadow:0 8px 0 #c4501d,0 0 0 10px rgba(255,255,255,.45);display:grid;place-items:center;cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.play svg{width:44%;height:44%;margin-left:8%}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- menu ---------- */
#menu .wrap{gap:3vh;padding:88px 16px 12px}
.cards{--cw:min(16vw,30vh,200px);--gap:clamp(10px,2vw,24px);display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center}
.card{width:var(--cw);height:var(--cw);border:none;border-radius:30px;padding:calc(var(--cw) * .07);background:var(--cbg);box-shadow:0 10px 0 var(--cshadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;cursor:pointer;
  animation:popin .5s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .15s,box-shadow .15s}
.card:nth-child(2){animation-delay:.09s}.card:nth-child(3){animation-delay:.18s}.card:nth-child(4){animation-delay:.27s}.card:nth-child(5){animation-delay:.36s}
.c-count{--cbg:#fff0d4;--cshadow:#eeb05a}
.c-path{--cbg:#ffe3ec;--cshadow:#f08fb0}
.ico-num{font-family:var(--font);font-weight:700;font-size:21px;fill:#fff;text-anchor:middle}
.ico-num.s{font-size:14px}
.card:hover{transform:translateY(-6px) rotate(-2deg)}
.card:active{transform:translateY(6px);box-shadow:0 4px 0 var(--cshadow)}
.card svg{width:80%;flex:1;min-height:0}
.card span{font-weight:700;font-size:clamp(14px,2.4vmin,22px);color:#4a3426}
.c-bubbles{--cbg:#dff1ff;--cshadow:#7fb8ec}
.c-hide{--cbg:#e2f7dc;--cshadow:#7fc472}
.c-music{--cbg:#efe6ff;--cshadow:#a58be6}
#menu .poppy{height:min(30vh,250px)}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- star tray ---------- */
.tray{position:absolute;top:24px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;pointer-events:none;
  --star:clamp(20px,calc((100vw - 360px) / var(--n) - 6px),44px)}
.slot{width:var(--star);aspect-ratio:1}
.slot svg{display:block;width:100%;height:100%}
.slot path{fill:var(--slot);stroke:var(--slot-stroke);stroke-width:1.4;stroke-linejoin:round;transition:fill .2s}
.slot.on path{fill:#ffcf33;stroke:#e09a00}
.slot.on{animation:starpop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes starpop{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* ---------- bubbles ---------- */
#bPoppy{position:absolute;left:3%;bottom:4%;height:min(30vh,240px);z-index:1}
.field{position:absolute;inset:0;pointer-events:none;z-index:2}
.bubble{position:absolute;left:0;top:0;border-radius:50%;pointer-events:auto;cursor:pointer;display:grid;place-items:center;will-change:transform;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 18%,hsla(var(--h),90%,75%,.35) 55%,hsla(var(--h),90%,60%,.6) 100%);
  border:3px solid hsla(var(--h),90%,88%,.95);box-shadow:inset -6px -8px 18px hsla(var(--h),90%,55%,.35),0 4px 14px rgba(0,0,0,.08)}
.bubble span{line-height:1;pointer-events:none}
.drop,.confetti{position:absolute;left:0;top:0;border-radius:3px}
.drop{border-radius:50%}

/* ---------- hide and seek ---------- */
.spots{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;align-items:flex-end;gap:2.5vw;z-index:2}
.spot{position:relative;width:min(22vw,36vh,230px);aspect-ratio:6/5;border:none;background:none;padding:0;cursor:pointer;
  animation:popin .45s cubic-bezier(.3,1.6,.5,1) backwards}
.spot:focus-visible{outline-offset:8px;border-radius:16px}
.cover{position:absolute;inset:0;z-index:2;transform-origin:50% 100%}
.cover svg{display:block;width:100%;height:100%;overflow:visible}
.spot .hider{position:absolute;left:10%;bottom:0;width:80%;z-index:1;opacity:0;pointer-events:none;transform:translateY(12%);
  transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.spot.found .hider{opacity:1;pointer-events:auto;transform:translateY(-26%)}
.peek{position:absolute;z-index:1;width:36%;opacity:0;transform:translateX(-40%);transition:opacity .3s,transform .4s}
.peek svg{display:block;width:100%;transform-origin:0% 60%}
.spot.hint .peek{opacity:1;transform:translateX(0)}
.spot.hint .peek svg{animation:peekwag .5s ease-in-out infinite alternate}
.spot.found .peek{opacity:0}
.spot.nope .cover{animation:shake .45s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
@keyframes peekwag{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
.critter,.fnote{position:absolute;left:0;top:0;line-height:1}
.critter{font-size:clamp(40px,7vmin,64px);width:1em;height:1em;margin:-.5em 0 0 -.5em;text-align:center}
.fnote{width:44px;height:44px;margin:-22px 0 0 -22px}

/* ---------- music ---------- */
#mPoppy{position:absolute;left:50%;bottom:calc(5% + min(32vh,260px) + 14px);height:min(38vh,300px);transform:translateX(-50%);z-index:2}
.xylo{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(94vw,900px);height:min(32vh,260px);
  display:flex;align-items:center;gap:1.2%;padding:0 3%;z-index:3}
.rail{position:absolute;left:0;right:0;height:9%;background:#9a6440;border-radius:999px;box-shadow:0 4px 0 #6e4329}
.rail.r1{top:20%}.rail.r2{bottom:20%}
.bar{position:relative;z-index:1;flex:1;height:var(--hgt);border:none;padding:0;border-radius:16px;cursor:pointer;
  background:hsl(var(--h) 85% 62%);
  box-shadow:0 7px 0 hsl(var(--h) 70% 40%),inset 0 -10px 0 rgba(0,0,0,.08),inset 0 8px 0 rgba(255,255,255,.28);
  transition:transform .08s,box-shadow .08s,filter .08s}
.bar::before,.bar::after{content:"";position:absolute;left:50%;width:24%;max-width:14px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.bar::before{top:9%}.bar::after{bottom:9%}
.bar.hit{transform:translateY(5px);filter:brightness(1.15);
  box-shadow:0 2px 0 hsl(var(--h) 70% 40%),inset 0 -10px 0 rgba(0,0,0,.08),inset 0 8px 0 rgba(255,255,255,.28)}
.song{position:absolute;right:5%;bottom:calc(5% + min(32vh,260px) + 24px);width:84px;height:84px;z-index:4;
  background:#ffcf33;color:#a86a00;box-shadow:0 7px 0 #d39b00;animation:pulse 1.8s ease-in-out infinite}
.song.playing{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- counting ---------- */
.cstage{position:absolute;top:96px;bottom:3%;left:50%;transform:translateX(-50%);width:min(94vw,920px);
  display:flex;flex-direction:column;gap:1.8vh;--tok:clamp(42px,min(8.5vw,9.5vh),86px)}
.prompt{align-self:center;display:flex;align-items:center;gap:clamp(8px,1.6vw,16px);background:#fff;color:#4a3426;border-radius:999px;
  padding:6px 8px 6px 24px;box-shadow:0 6px 0 rgba(0,0,0,.12);font-weight:700;font-size:clamp(28px,5.2vmin,50px);line-height:1;
  min-height:clamp(58px,9vmin,80px);animation:popin .4s cubic-bezier(.3,1.6,.5,1) backwards}
.prompt .q{color:#ff7a3d}
.prompt .dots{height:.9em;width:auto}
.again{flex:none;width:clamp(46px,7vmin,62px);height:clamp(46px,7vmin,62px);border-radius:50%;border:none;padding:0;background:#ffcf33;color:#7a4b00;
  display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 #d39b00}
.again svg{width:55%;height:55%}
.again:active{transform:translateY(3px);box-shadow:0 1px 0 #d39b00}
.board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px);
  background:rgba(255,255,255,.28);border-radius:32px;padding:14px}
.grp{display:grid;grid-template-columns:repeat(var(--cols),var(--tok));gap:clamp(8px,1.4vw,16px);justify-content:center}
.plus{font-weight:700;font-size:calc(var(--tok) * .95);line-height:1;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.tok{position:relative;width:var(--tok);aspect-ratio:1;border-radius:50%;border:none;padding:0;background:rgba(255,255,255,.88);
  box-shadow:0 5px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-size:calc(var(--tok) * .58);line-height:1;cursor:pointer;
  transform:rotate(var(--r,0deg));animation:popin .4s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .15s,background .15s}
.tok.counted{background:#fff2a8;box-shadow:0 5px 0 #e0b400}
.tok.lit{transform:scale(1.18)}
.tok.gone{visibility:hidden}
.badge{position:absolute;top:-10%;right:-10%;width:44%;aspect-ratio:1;border-radius:50%;background:#ff7a3d;color:#fff;font-weight:700;
  font-size:calc(var(--tok) * .25);display:grid;place-items:center;box-shadow:0 2px 0 #c4501d;animation:starpop .35s cubic-bezier(.3,1.8,.5,1)}
.crow{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,40px)}
#cPoppy,#pPoppy{flex:none;height:clamp(104px,min(24vh,30vw),200px)}
.cright{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.4vw,26px);padding-bottom:8px}
.ans{width:clamp(64px,min(17vw,17vh),140px);aspect-ratio:4/5;border:none;border-radius:24px;padding:6%;background:var(--abg);box-shadow:0 9px 0 var(--ash);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8%;cursor:pointer;
  animation:popin .45s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .12s,box-shadow .12s,opacity .25s}
.ans b{font-size:clamp(36px,min(7vw,7vh),74px);font-weight:700;line-height:1;color:#4a3426}
.ans .dots{height:clamp(18px,min(3.6vw,3.6vh),32px);width:auto}
.ans:active{transform:translateY(6px);box-shadow:0 3px 0 var(--ash)}
.ans.wrong{animation:shake .45s;opacity:.4;cursor:default}
.ans.right{background:#c9f5b8;box-shadow:0 9px 0 #5cb84a;transform:scale(1.1)}
.basket{position:relative;margin-top:40px;padding:14px 18px 20px;border-radius:16px 16px 46px 46px;
  background:repeating-linear-gradient(90deg,#d99a52 0 12px,#c98a44 12px 24px);box-shadow:0 7px 0 #9a6430;
  display:grid;grid-template-columns:repeat(var(--cols),calc(var(--tok) * .85));gap:8px}
.basket::before{content:"";position:absolute;left:20%;right:20%;top:-40px;height:52px;border:8px solid #b97a3a;border-bottom:none;border-radius:999px 999px 0 0}
.bslot{width:calc(var(--tok) * .85);aspect-ratio:1;border-radius:50%;border:3px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.18);
  display:grid;place-items:center;font-size:calc(var(--tok) * .5);line-height:1}
.bslot.full{border-style:solid;background:rgba(255,255,255,.8);animation:starpop .35s cubic-bezier(.3,1.8,.5,1)}
.flyer{position:absolute;left:0;top:0;width:1em;height:1em;margin:-.5em 0 0 -.5em;line-height:1;text-align:center}

/* ---------- number path: map ---------- */
.pview{position:absolute;inset:0}
.pview[hidden]{display:none}
.pstat{position:absolute;top:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:3;pointer-events:none;
  background:#fff;color:#4a3426;border-radius:999px;padding:6px 20px 6px 12px;font-weight:700;font-size:clamp(22px,4vmin,32px);line-height:1;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.pstat svg{width:1.3em;height:1.3em}
.pstat path{fill:#ffcf33;stroke:#e09a00;stroke-width:1.4;stroke-linejoin:round}
.pstat span{opacity:.5;font-size:.75em}
.pmap{position:absolute;top:110px;bottom:24px;left:50%;transform:translateX(-50%);width:min(92vw,1000px)}
.pline{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pline path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pline .road{stroke:rgba(255,255,255,.35);stroke-width:26}
.pline .dash{stroke:#fff;stroke-width:9;stroke-dasharray:1 22}
.pstones{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--pc,4),1fr);grid-template-rows:repeat(var(--pr,3),1fr);place-items:center}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app'), fx = $('#fx');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const COLORS = ['#ff5d5d', '#ffb13d', '#ffd23d', '#5ccf6a', '#3fc7c2', '#4d9dff', '#a77bff', '#ff7ab6'];

/* ================= Sound ================= */
let ctx = null, master = null, soundOn = true;
try { soundOn = localStorage.getItem('poppy-sound') !== 'off'; } catch (e) {}

function ensureAudio() {
  try {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = soundOn ? 0.7 : 0;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  } catch (e) {}
}
function tone(freq, dur = 0.4, type = 'sine', vol = 0.3, when = 0, slideTo = null) {
  if (!ctx || !soundOn) return;
  const t = ctx.currentTime + when;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  pop() { tone(rand(520, 760), 0.16, 'sine', 0.45, 0, 160); tone(1400, 0.05, 'triangle', 0.08); },
  blip() { tone(380, 0.14, 'sine', 0.2, 0, 720); },
  boing() { tone(180, 0.4, 'triangle', 0.35, 0, 480); tone(90, 0.25, 'sine', 0.2); },
  giggle() { [880, 1046, 932, 1175, 988].forEach((f, i) => tone(f, 0.09, 'triangle', 0.18, i * 0.075)); },
  chime() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.5, 'triangle', 0.22, i * 0.09)); },
  tada() { [392, 523.25, 659.25].forEach((f, i) => tone(f, 0.18, 'square', 0.07, i * 0.09)); tone(783.99, 0.7, 'triangle', 0.28, 0.27); tone(1046.5, 0.7, 'sine', 0.14, 0.27); },
  note(f) { tone(f, 1.1, 'sine', 0.38); tone(f * 2, 0.5, 'sine', 0.1); tone(f * 3, 0.18, 'triangle', 0.05); },
  tap() { tone(660, 0.08, 'sine', 0.18, 0, 990); }
};

/* Poppy's voice (uses the browser's built-in speech) */
const canSpeak = 'speechSynthesis' in window;
let voice = null, sayTimer = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    voice = vs.find(v => /samantha|aria|jenny|google us english|zira|karen|moira|tessa|victoria|female/i.test(v.name)) || vs[0] || null;
  } catch (e) {}
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!soundOn || !canSpeak) return;
  try {
    clearTimeout(sayTimer);
    speechSynthesis.cancel();
    sayTimer = setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.pitch = 1.45; u.rate = 1.02;
      speechSynthesis.speak(u);

}

/* ================= Poppy the fox ================= */

<g class="p-tail"><path class="f-fox" d="M128 196C121.5 167 142.8 133.1 173.9 130.5C182.1 160.6 157.5 192.2 128 196Z"/><path class="f-cream" d="M149.4 140.2Q162.3 129.6 173.9 130.5Q178.6 141.1 173.2 156.8Q164.7 143.6 149.4 140.2Z"/></g>

<g class="p-head">
<path class="f-fox s-fox" d="M50 76L64 20L98 58Z"/><path class="f-ink" opacity=".8" d="M60 66L67 37L85 58Z"/>
<path class="f-fox s-fox" d="M150 76L136 20L102 58Z"/><path class="f-ink" opacity=".8" d="M140 66L133 37L115 58Z"/>

const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
function makeTray(el, n) {
  el.style.setProperty('--n', n);
  const slots = [];
  for (let i = 0; i < n; i++) { const s = document.createElement('div'); s.className = 'slot'; s.innerHTML = STAR; el.appendChild(s); slots.push(s); }
  return {
    n, count: 0,
    add() { if (this.count >= n) return null; slots[this.count].classList.add('on'); return ++this.count; },
    reset() { this.count = 0; slots.forEach(s => s.classList.remove('on')); }
  };
}

const field = $('#bField');
const B = { list: [], running: false, tok: 0, last: 0, acc: 0, tray: makeTray($('#bTray'), 10) };
const B_HUES = [200, 170, 280, 330, 40, 120, 10];
const TREATS = ['⭐', '🐟', '🍓', '🌸', '🦆', '🍎', '🐞', '🦋', '🍪'];
const NUM = ['', 'One!', 'Two!', 'Three!', 'Four!', 'Five!', 'Six!', 'Seven!', 'Eight!', 'Nine!', 'Ten! Hooray!'];

function placeBubble(b) { b.el.style.transform = `translate3d(${b.x}px,${b.y}px,0)`; }
function spawnBubble(cx, cy, size) {
  const W = field.clientWidth, H = field.clientHeight, base = Math.min(W, H);
  const s = size || rand(Math.max(72, base * 0.13), Math.max(104, base * 0.21));
  const el = document.createElement('div');
  el.className = 'bubble';
  const hue = pick(B_HUES);
  el.style.setProperty('--h', hue);
  el.style.width = el.style.height = s + 'px';
  if (Math.random() < 0.4) { const sp = document.createElement('span'); sp.textContent = pick(TREATS); sp.style.fontSize = s * 0.42 + 'px'; el.appendChild(sp); }
  const x0 = cx != null ? cx - s / 2 : rand(8, Math.max(9, W - s - 8));
  const b = { el, s, hue, x0, x: x0, y: cy != null ? cy - s / 2 : H + rand(0, 30), vy: rand(42, 80), amp: rand(8, 26), ph: rand(0, 6.28), t: 0, popped: false };
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); popBubble(b); });
  field.appendChild(el); B.list.push(b); placeBubble(b);
  return b;
}
function popBubble(b) {
  if (b.popped) return;
  b.popped = true;
  sfx.pop();
  const f = field.getBoundingClientRect(), a = app.getBoundingClientRect();
  const cx = f.left - a.left + b.x + b.s / 2, cy = f.top - a.top + b.y + b.s / 2;
  b.el.style.transition = 'transform .18s ease-out, opacity .18s';
  b.el.style.transform += ' scale(1.35)';
  b.el.style.opacity = '0';
  setTimeout(() => b.el.remove(), 220);
  splash(cx, cy, b.hue);
  const c = B.tray.add();
  if (!c) return;
  say(NUM[c]);
  if (c === B.tray.n) {
    sfx.tada(); bigCelebrate(); jump(bPoppy);
    setTimeout(() => { if (current === 'bubbles') B.tray.reset(); }, 2600);
  } else if (c % 3 === 0) jump(bPoppy);
}
function bubbleLoop(tok, now) {
  if (!B.running || tok !== B.tok) return;
  const dt = Math.min(0.05, (now - B.last) / 1000);
  B.last = now;
  B.acc += dt * 1000;
  const W = field.clientWidth;
  const live = B.list.filter(b => !b.popped).length;
  if (B.acc > 850 && live < (W < 600 ? 6 : 9)) { B.acc = 0; spawnBubble(); }
  for (const b of B.list) {
    if (b.popped) continue;
    b.t += dt;
    b.y -= b.vy * dt;
    b.x = clamp(b.x0 + Math.sin(b.t * 1.3 + b.ph) * b.amp, 0, Math.max(0, W - b.s));
    placeBubble(b);
    if (b.y < -b.s - 20) { b.popped = true; b.el.remove(); }
  }
  B.list = B.list.filter(b => !b.popped);
  requestAnimationFrame(t => bubbleLoop(tok, t));
}
function startBubbles() {
  field.innerHTML = ''; B.list = []; B.tray.reset();
  B.running = true; B.acc = 0; B.last = performance.now();
  const tok = ++B.tok;
  requestAnimationFrame(() => {
    const H = field.clientHeight;
    for (let i = 0; i < 3; i++) { const b = spawnBubble(); b.y = rand(H * 0.45, H * 0.85); placeBubble(b); }
    requestAnimationFrame(t => { B.last = t; bubbleLoop(tok, t); });
  });
  say('Pop the bubbles!');
}
function stopBubbles() { B.running = false; B.tok++; field.innerHTML = ''; B.list = []; }
screens.bubbles.addEventListener('pointerdown', e => {
  if (e.target.closest('.bubble,.poppy')) return;
  if (B.list.filter(b => !b.popped).length >= 16) return;
  const r = field.getBoundingClientRect();
  spawnBubble(e.clientX - r.left, e.clientY - r.top, rand(64, 84));
  sfx.blip();
});

    return t;
  });
  pBoard.appendChild(g);
  return tiles;
}
function numAnswers(correct, lo, hi, dots) {
  const opts = new Set([correct]);
  let guard = 0;
  while (opts.size < 3 && guard++ < 80) { const v = correct + randInt(-2, 2); if (v >= lo && v <= hi) opts.add(v); }
  while (opts.size < 3) opts.add(randInt(lo, hi));
  [...opts].sort((a, b) => a - b).forEach((v, i) => {
    const b = document.createElement('button');
    b.className = 'ans';
    b.dataset.v = v;
    b.setAttribute('aria-label', String(v));
    b.style.setProperty('--abg', ANS_COLORS[i][0]);
    b.style.setProperty('--ash', ANS_COLORS[i][1]);
    b.style.animationDelay = 200 + i * 90 + 'ms';
    b.innerHTML = `<b>${v}</b>` + (dots ? dotsSVG(v) : '');
    b.addEventListener('click', () => pAnswer(b, v));
    if (v === correct) P.rightEl = b;
    pRight.appendChild(b);
  });
}
function emojiAnswers(items, correct) {
  shuffle(items).forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'ans';
    b.dataset.e = it.e;
    b.setAttribute('aria-label', it.one);
    b.style.setProperty('--abg', ANS_COLORS[i][0]);
    b.style.setProperty('--ash', ANS_COLORS[i][1]);
    b.style.animationDelay = 200 + i * 90 + 'ms';
    b.innerHTML = `<b>${it.e}</b>`;
    b.addEventListener('click', () => pAnswer(b, it.e));
    if (it === correct) P.rightEl = b;
    pRight.appendChild(b);
  });
}
function showCounts() {
  pBoard.querySelectorAll('.pick').forEach(b => { if (!b.querySelector('.pcount')) b.insertAdjacentHTML('beforeend', `<b class="pcount">${b.dataset.v}</b>`); });
}
/* light tiles up one by one with a number badge, like counting with a finger */
function countAlong(tiles, done) {
  tiles.forEach((t, i) => pLater(() => {
    t.classList.add('counted', 'lit');
    setTimeout(() => t.classList.remove('lit'), 380);
    const b = document.createElement('span');
    b.className = 'badge'; b.textContent = i + 1;
    t.appendChild(b);
    countTone(i + 1);
    say(Word(i + 1) + '!');
  }, 400 + i * 700));
  pLater(done, 400 + tiles.length * 700 + 200);
}
function flyAway(t, emoji) {
  const p = pointIn(t);
  t.classList.add('away');
  sfx.blip();
  const d = document.createElement('div');
  d.className = 'critter';
  d.textContent = emoji;
  d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
  fx.appendChild(d);
  const dx = rand(-120, 120);
  d.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${dx * 0.4}px,-90px) scale(1.1) rotate(${dx > 0 ? 10 : -10}deg)`, opacity: 1, offset: 0.4 },
    { transform: `translate(${dx}px,-260px) scale(.8)`, opacity: 0 }
  ], { duration: 1400, easing: 'ease-in' }).onfinish = () => d.remove();
}

const BUILD = {
  /* Which group has more (or fewer)? */
  more(o) {
    const minDiff = o.max <= 5 ? 2 : 1;
    let a, b;
    do { a = randInt(1, o.max); b = randInt(1, o.max); } while (Math.abs(a - b) < minDiff);
    const fewer = o.fewer && Math.random() < 0.5, f = pItem(FRUITS), word = fewer ? 'fewer' : 'more';
    P.answer = fewer ? Math.min(a, b) : Math.max(a, b);
    [a, b].forEach(n => pickBtn(n, `${n} ${nm(f, n)}`, dotGroup(n, f.e)));
    pSetPrompt(`<span class="w">${fewer ? 'Fewer' : 'More'}</span><span>${f.e}</span><span class="q">?</span>`);
    P.question = `Which has ${word} ${f.many}?`;
    P.hint = () => { showCounts(); say(`Let's count! ${Word(a)}, and ${WORDS[b]}. Which has ${word}?`); };
  },
  /* A written number, no dots: find the group that has that many */
  match(o) {
    const n = pRand(1, o.max), f = pItem(FRUITS);
    const opts = new Set([n]);
    while (opts.size < 3) { const v = n + randInt(-3, 3); if (v >= 1 && v <= o.max) opts.add(v); }
    P.answer = n;
    shuffle([...opts]).forEach(v => pickBtn(v, `${v} ${nm(f, v)}`, dotGroup(v, f.e)));
    pSetPrompt(`<span>${n}</span><span>${f.e}</span>`);
    P.question = `Find ${WORDS[n]} ${nm(f, n)}!`;
    P.hint = () => { showCounts(); say(`Let's count them! Which one has ${WORDS[n]}?`); };
  },
  /* What comes next in the pattern? */
  pattern(o) {
    const kind = pick(o.kinds), items = shuffle(PAT).slice(0, 4);
    const unit = kind.split('').map(ch => items[ch.charCodeAt(0) - 65]);
    const len = unit.length * 2 + randInt(0, 1), seq = [];
    for (let i = 0; i < len; i++) seq.push(unit[i % unit.length]);
    const ans = unit[len % unit.length];
    const choices = [...new Set(unit)];
    if (choices.length < 3) choices.push(items[3]);
    P.answer = ans.e;
    const tiles = tileRow([...seq.map(x => x.e), '?']);
    const blank = tiles[tiles.length - 1];
    emojiAnswers(choices, ans);
    pSetPrompt(`<span class="w">Next</span><span class="q">?</span>`);
    P.question = 'What comes next?';
    P.onRight = () => { blank.textContent = ans.e; blank.classList.remove('blank'); };
    P.hint = () => {
      say(seq.map(x => x.one).join(', ') + '... What comes next?');
      tiles.slice(0, -1).forEach((t, i) => pLater(() => {
        t.classList.add('lit'); setTimeout(() => t.classList.remove('lit'), 360);
        tone(392 * Math.pow(2, PAT.indexOf(seq[i]) / 6), 0.2, 'triangle', 0.22);
      }, 200 + i * 520));
      pLater(() => blank.classList.add('glow'), 200 + len * 520);
    };
  },
  /* A row of numbers with a gap */
  missing(o) {
    const L = o.max <= 5 ? 4 : 5, start = pRand(1, o.max - L + 1), idx = randInt(1, L - 1), ans = start + idx;
    const nums = Array.from({ length: L }, (_, i) => start + i);
    P.answer = ans;
    const tiles = tileRow(nums.map((n, i) => (i === idx ? '?' : String(n))));
    tiles.forEach(t => t.classList.add('num'));
    numAnswers(ans, 1, o.max, false);
    pSetPrompt(`<span class="w">Missing</span><span class="q">?</span>`);
    P.question = 'Which number is missing?';
    P.onRight = () => { tiles[idx].textContent = ans; tiles[idx].classList.remove('blank'); };
    P.hint = () => {
      say(nums.slice(0, idx).map(Word).join(', ') + '... What comes next?');
      tiles.slice(0, idx).forEach((t, i) => pLater(() => {
        t.classList.add('lit'); setTimeout(() => t.classList.remove('lit'), 360);
        countTone(nums[i]);
      }, 200 + i * 560));
      pLater(() => tiles[idx].classList.add('glow'), 200 + idx * 560);
    };
  },
  /* A little story: some animals leave, how many are left? */
  takeaway(o, intro) {
    const total = pRand(2, o.max), k = randInt(1, Math.min(3, total - 1)), left = total - k, c = pItem(CREATURES);
    const verb = k === 1 ? c.v1 : c.vn;
    P.answer = left;
    P.busy = true;
    const tiles = tileRow(Array(total).fill(c.e), Math.min(total, 5));
    pSetPrompt(`<span>${total}</span><span>${c.e}</span><span>−</span><span>${k}</span><span class="q">?</span>`);
    P.question = `${Word(total)} ${nm(c, total)}. ${Word(k)} ${verb}. How many are left?`;
    pLater(() => say(intro + `${Word(total)} ${nm(c, total)}.`), 350);
    pLater(() => {
      tiles.slice(-k).forEach((t, j) => setTimeout(() => flyAway(t, c.e), j * 260));
      say(`${Word(k)} ${verb}!`);
    }, 2700);
    pLater(() => { say('How many are left?'); numAnswers(left, 1, o.max, true); P.busy = false; }, 4900);
    P.hint = () => {
      P.busy = true;
      say("Let's count who stayed!");
      pLater(() => countAlong(tiles.slice(0, left), () => { P.busy = false; say(`${Word(left)}! Which one is ${WORDS[left]}?`); }), 900);
    };
    return true;
  },
  /* Two written numbers: which is bigger? */
  bigger(o) {
    let a, b;
    do { a = randInt(1, o.max); b = randInt(1, o.max); } while (a === b);
    P.answer = Math.max(a, b);
    const btns = [a, b].map(n => {
      const num = document.createElement('b');
      num.textContent = n;
      const btn = pickBtn(n, String(n), num);
      btn.classList.add('bignum');
      return btn;
    });
    pSetPrompt(`<span class="w">Bigger</span><span class="q">?</span>`);
    P.question = 'Which number is bigger?';
    P.hint = () => { btns.forEach(btn => btn.insertAdjacentHTML('beforeend', dotsSVG(+btn.dataset.v))); say('Look at the dots! Which one has more?'); };
  }
};

function pAnswer(el, v) {
  if (P.busy || el.classList.contains('wrong') || P.answer === null) return;
  if (v === P.answer) {
    P.busy = true;
    pBoard.querySelectorAll('.glow').forEach(g => g.classList.remove('glow'));
    el.classList.remove('glow');
    el.classList.add('right');
    if (P.onRight) P.onRight();
    sfx.tada();
    const p = pointIn(el, 0.5, 0.3);
    confetti(p.x, p.y, 45);
    jump(pPoppy);
    say(pick(['Yes!', 'Well done!', 'You got it!', 'Super!', 'Great job!']));
    const c = P.tray.add();
    pLater(c === P.tray.n ? finishLevel : () => pRound(false), c === P.tray.n ? 1500 : 2300);
    return;
  }
  P.wrong++; P.mistakes++;
  el.classList.add('wrong');
  sfx.boing();
  if (P.wrong === 1 && P.hint) P.hint();
  else { say('Almost! Try this one!'); if (P.rightEl) P.rightEl.classList.add('glow'); }
}

/* Stars depend on how many tries it took; a sticker the first time a stone is finished */
function finishLevel() {
  pClear();
  P.busy = true;
  const i = P.level, st = P.mistakes <= 1 ? 3 : P.mistakes <= 3 ? 2 : 1, firstTime = !starsOf(i);
  pSave.stars[i] = Math.max(starsOf(i), st);
  savePath();
  const allDone = nextLevel() < 0;
  bigCelebrate();
  pResult.innerHTML = `<div class="rcard"><div class="rstars">${('<div class="slot">' + STAR + '</div>').repeat(3)}</div>`
    + (firstTime ? `<div class="rsticker">${STICKERS[i]}</div>` : '')
    + `<button class="play rnext" aria-label="Back to the path">${PLAY_ICON}</button></div>`;
  pResult.classList.add('show');
  const slots = pResult.querySelectorAll('.slot');
  for (let k = 0; k < st; k++) pLater(() => { slots[k].classList.add('on'); tone(660 * Math.pow(2, k * 4 / 12), 0.35, 'triangle', 0.25); }, 500 + k * 380);
  const msg = (st === 3 ? 'Wow! Three stars!' : st === 2 ? 'Great job! Two stars!' : 'You did it! One star!')
    + (firstTime && allDone ? ' You finished the whole path! You are a number champion!' : firstTime ? ' And a new sticker!' : '');
  pLater(() => say(msg), 400);
  pResult.querySelector('.rnext').addEventListener('click', () => { sfx.tap(); showMap(firstTime ? i : undefined); });
}
function startPath() { showMap(); }
function stopPath() { pClear(); P.view = 'map'; pResult.classList.remove('show'); }

/* ================= Keyboard mashing welcome ================= */
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.key === 'Tab' || e.key === 'Escape') return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('button')) return;
  ensureAudio();
  if (current === 'music') {
    e.preventDefault();
    if (e.repeat) return;
    const code = e.key.length === 1 ? e.key.toLowerCase().charCodeAt(0) : e.keyCode;
    playBar(code % 8);
  } else if (current === 'bubbles') {
    e.preventDefault();
    if (e.repeat) return;
    const live = B.list.filter(b => !b.popped);
    if (live.length) popBubble(pick(live));
  } else if (current === 'count' && /^[0-9]$/.test(e.key)) {
    const b = cRight.querySelector(`.ans[data-v="${e.key === '0' ? 10 : e.key}"]`);
    if (b) b.click();
  } else if (current === 'path' && /^[0-9]$/.test(e.key)) {
    const v = e.key === '0' ? 10 : e.key;
    const b = pRight.querySelector(`.ans[data-v="${v}"]`) || pBoard.querySelector(`.pick[data-v="${v}"]`);
    if (b) b.click();
  }
});

/* Unlock audio on any touch or click; quiet things down if the tab is hidden */
document.addEventListener('pointerdown', ensureAudio, { capture: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { songTok++; songBtn.classList.remove('playing'); if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} } }
});
document.addEventListener('contextmenu', e => e.preventDefault());
})();
